name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify SDK provenance and release version
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('third_party/cpa-sdk')
          for path, digest in json.loads((root / 'PROVENANCE.json').read_text())['files'].items():
              assert hashlib.sha256((root / path).read_bytes()).hexdigest() == digest, path
          version = pathlib.Path('VERSION').read_text().strip()
          assert f'Version: "{version}"' in pathlib.Path('internal/bridge/bridge.go').read_text()
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - name: Race tests and native ABI build
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src \
            -e GOCACHE=/tmp/go-build -e GOPATH=/tmp/go \
            golang:1.26-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d \
            sh -c 'go test -race ./... && (cd third_party/cpa-sdk && go test ./...) && sh scripts/build.sh'
      - name: Package
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.zip > checksums.txt
          gh release create "$GITHUB_REF_NAME" *.zip checksums.txt \
            --verify-tag --title "Quota handoff $GITHUB_REF_NAME" --generate-notes
